  <title id="logo-title">JosephsonCircuits — small circuit nodes, light mode</title>
  <desc id="logo-description">Three small green, red and purple nodes form a triangular circuit with a blue boxed Josephson junction, an inductor and a capacitor. A detached blue wavepacket sits inside the triangle. Pure vector artwork with editable named groups.</desc>
