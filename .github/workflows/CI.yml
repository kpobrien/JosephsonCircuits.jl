name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts' # long-term support release
          - '1'   # latest stable 1.x release
          - 'pre' # latest stable prerelease
          # - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        threads:
          - 'auto'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # the environment instantiated and precompiled in the configuration
      # the tests run in (`Pkg.test` adds `--check-bounds=yes`, which is a
      # pkgimage configuration of its own); `julia-buildpkg` cannot be
      # given the flag and would compile the default configuration, which
      # nothing in this job uses
      - run: julia --color=yes --check-bounds=yes --project=@. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  interop:
    name: Extensions - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # the optional extensions (Krylov.jl, SciMLBase) against the package
      # from this checkout, in the interop test environment
      - run: julia --project=test/interop -e 'using Pkg; Pkg.develop(path = "."); Pkg.instantiate(); include("test/interop/runtests.jl")'
